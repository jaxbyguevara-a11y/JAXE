name: Android CI

# The audit environment could not reach dl.google.com (Android SDK), so the
# build was never executed locally — see AUDITORIA.md §9. This workflow is the
# real verification: GitHub runners ship the Android SDK.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21, not 17: Robolectric refuses to build a sandbox for Android SDK
      # 36 on anything older ("Android SDK 36 requires Java 21"). The compiled
      # bytecode target stays at 17 (see app/build.gradle.kts) — this is only
      # the JVM that runs Gradle and the tests.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # packages: '' is required — by default this action installs the legacy
      # 'tools' package, which Google removed from the SDK repository, and
      # sdkmanager exits 1 with "Failed to find package 'tools'".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug

      # APK de depuración instalable para pruebas en dispositivo real.
      # applicationIdSuffix ".debug" permite instalarlo junto a una eventual
      # versión de Play sin conflicto.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jaxia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # roborazzi.test.record=true hace que captureRoboImage escriba los PNG.
      # Sin ese flag los tests pasan pero no se genera ninguna imagen, y el
      # artefacto de capturas sale vacío.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest -Proborazzi.test.record=true

      # Las capturas se versionan en el repositorio además de publicarse como
      # artefacto: el almacenamiento de artefactos de GitHub no es accesible
      # desde todas las redes, y tenerlas en git permite revisar los cambios
      # visuales en el diff.
      # [skip ci] evita que este commit dispare otra ejecución.
      - name: Commit rendered screenshots
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain app/src/test/screenshots/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/test/screenshots/
            git commit -m "chore(ci): actualizar capturas renderizadas [skip ci]"
            git push
          else
            echo "Las capturas no cambiaron."
          fi

      # Capturas renderizadas por Roborazzi (pantalla de bienvenida).
      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jaxia-screenshots
          path: app/src/test/screenshots/
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Release bundle. Signing material comes from repository secrets; when
      # they are absent (forks, PRs) the build still runs and produces an
      # unsigned bundle rather than failing — see app/build.gradle.kts.
      # The `secrets` context is not available in a step-level `if:`, so the
      # presence check happens in the shell instead.
      - name: Decode upload keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
            echo "Keystore configurado: el AAB saldrá firmado."
          else
            echo "Sin secreto KEYSTORE_BASE64: el AAB saldrá SIN FIRMAR."
          fi

      - name: Build release bundle (AAB)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: jaxia-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
